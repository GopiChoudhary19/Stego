# Render free tier: backend API + Postgres. Frontend is deployed on Vercel (see frontend/vercel.json).
services:
  - type: web
    name: stego-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DB_HOST
        fromDatabase: {name: stego-db, property: host}
      - key: DB_PORT
        fromDatabase: {name: stego-db, property: port}
      - key: DB_NAME
        fromDatabase: {name: stego-db, property: database}
      - key: DB_USER
        fromDatabase: {name: stego-db, property: user}
      - key: DB_PASSWORD
        fromDatabase: {name: stego-db, property: password}
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # set to the Vercel URL, e.g. https://stego.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /actuator/health

databases:
  - name: stego-db
    plan: free
    databaseName: stego
    user: stego_admin
    postgresMajorVersion: "16"
