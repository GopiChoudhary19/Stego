# Render free tier: backend API + frontend + Postgres.
services:
  - type: web
    name: stego-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DB_HOST
        fromDatabase: {name: stego-db, property: host}
      - key: DB_PORT
        fromDatabase: {name: stego-db, property: port}
      - key: DB_NAME
        fromDatabase: {name: stego-db, property: database}
      - key: DB_USER
        fromDatabase: {name: stego-db, property: user}
      - key: DB_PASSWORD
        fromDatabase: {name: stego-db, property: password}
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx350m
      - key: ALLOWED_ORIGINS
        fromService: {name: stego-frontend, type: web, envVarKey: RENDER_EXTERNAL_URL}
      - key: FRONTEND_URL
        fromService: {name: stego-frontend, type: web, envVarKey: RENDER_EXTERNAL_URL}
    healthCheckPath: /actuator/health

  - type: web
    name: stego-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService: {name: stego-backend, type: web, envVarKey: RENDER_EXTERNAL_URL}

databases:
  - name: stego-db
    plan: free
    databaseName: stego
    user: stego_admin
    postgresMajorVersion: "16"
